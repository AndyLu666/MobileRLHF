name: DPO/KTO Checks

on:
  pull_request:
    paths:
      - "pytorch_alignment/**"
      - "android-visualizer/app/src/main/assets/mft_demo_data/**"
      - "scripts/convert_dpo_to_kto_jsonl.py"
      - "scripts/prepare_fedrl_datasets.py"
      - "scripts/federated/**"
      - "tests/**"
      - ".github/workflows/dpo-checks.yml"
  push:
    branches:
      - main
      - dpo-trainer-parity
    paths:
      - "pytorch_alignment/**"
      - "android-visualizer/app/src/main/assets/mft_demo_data/**"
      - "scripts/convert_dpo_to_kto_jsonl.py"
      - "scripts/prepare_fedrl_datasets.py"
      - "scripts/federated/**"
      - "tests/**"
      - ".github/workflows/dpo-checks.yml"

jobs:
  preference-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers peft

      - name: Run DPO/KTO unit tests
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -m unittest
          tests.test_dpo_utils
          tests.test_qa_preference_tools
          tests.test_federated_tools

      - name: Validate FedRL DPO/KTO datasets
        run: PYTHONPATH=. python scripts/prepare_fedrl_datasets.py

      - name: Compile maintained FedRL scripts
        run: |
          python -m py_compile \
            scripts/convert_dpo_to_kto_jsonl.py \
            scripts/prepare_fedrl_datasets.py \
            scripts/federated/aggregate_lora_jsonl.py \
            scripts/federated/summarize_fedrl_round.py
